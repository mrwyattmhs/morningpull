title: "The Morning Pull"
subtitle: "A daily dispatch, assembled overnight."
timezone: "America/New_York"

model: "claude-haiku-4-5-20251001"

# Cost dials. news_per_day × max_searches_per_prompt is the whole API bill.
# 3 × 3 matches what the briefing was already doing, so switching to the
# rotation below costs the same as before.
news_per_day: 3
max_searches_per_prompt: 3

# Sections built locally in wildcards.py. No API call, no tokens.
# Order doesn't matter; one is chosen per day, cycling through the list.
# Add a key here once you've registered it in wildcards.py.
wildcards:
  - shikaku
  - music
  #- numbers
wildcards_per_day: 2

# ---------------------------------------------------------------------------
# The topic pool. Each day picks `news_per_day` of these, walking through the
# list so every topic comes up in turn. Deliberately interleaved: neighbours
# get drawn together, so keeping the car topics apart avoids a page where all
# three sections cover the same GM press release.
#
# Add or remove freely — the rotation adapts to the length of the list.
# ---------------------------------------------------------------------------
news_topics:
  - title: "Blackwing & V-Series"
    prompt: >
      Find news from the past week about the Cadillac CT4-V and CT5-V
      Blackwing and the wider V-Series line: production news, model year
      changes, notable reviews, owner-relevant technical service news, and
      credible reporting on future V-Series products. Note clearly when
      something is a rumor or single-source. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Formula 1"
    prompt: >
      Find the most significant Formula 1 news from the past few days: race
      results, championship standings, driver and team announcements,
      technical developments, and regulation news. If a race weekend just
      happened, lead with what actually decided it. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Manual transmission performance cars"
    prompt: >
      Find news from the past week about manual-transmission performance
      cars, with an American focus but not exclusively: new models keeping a
      stick, manuals being discontinued, takes on the future of the manual
      transmission, and notable reviews of three-pedal cars. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Guitar gear & players"
    prompt: >
      Find news from the past week in the guitar world: notable new guitars,
      amps, and pedals, significant player news and interviews, and anything
      interesting in guitar technique or instrument technology. Skip
      roundups and listicles. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Cadillac racing"
    prompt: >
      Find recent news on Cadillac's factory motorsport efforts: the V-Series.R
      in IMSA and WEC, Le Mans, driver lineups, results, and technical
      developments. If there's been no racing recently, say so briefly rather
      than reaching for older news. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "AI research & industry"
    prompt: >
      Find the most significant AI news from the past few days: notable model
      releases, research results, industry moves, and policy developments.
      Prioritize substance over product announcements and hype. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "IndyCar, IMSA & endurance racing"
    prompt: >
      Find recent news from North American and endurance motorsport outside
      Formula 1: IndyCar, IMSA, and WEC. Race results, championship
      implications, driver news, and upcoming events — including anything at
      Mid-Ohio. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Mathematics"
    prompt: >
      Find recent news in mathematics: notable proofs or results, interesting
      problems, prizes and people, and mathematics education. Explain any
      result in plain language and say why it matters. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Track driving & car control"
    prompt: >
      Find recent material on track driving and high-performance driver
      education: technique, tires and brakes for track use, data and coaching
      tools, notable HPDE or time-attack events, and track-day car preparation.
      Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Enthusiast car market"
    prompt: >
      Find recent news on the enthusiast and collector car market: notable
      auction results, cars appreciating or falling, and modern performance
      cars trending toward collectibility. Include specific figures where
      available. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Developer tools & automation"
    prompt: >
      Find recent news useful to someone building small automation projects:
      GitHub and GitHub Actions, Python tooling, APIs, and practical developer
      tooling. Prioritize concrete changes over opinion pieces. Do not include "I will search
      this up" commentary, directly post information only.

  - title: "Space & science"
    prompt: >
      Find the most interesting science news from the past few days, with a
      lean toward space, physics, and engineering: missions, launches,
      discoveries, and results. Explain why each item is significant.
      Do not include "I will search
      this up" commentary, directly post information only.
