name: Morning dispatch

on:
  schedule:
    # 10:01 UTC = 6:01 AM Eastern (EDT) / 5:01 AM (EST).
    - cron: "1 10 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

# contents: write lets the run commit each day's page into archive/.
# Without it the archive can't persist between runs.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Save this pull to the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive archive.html
          if git diff --staged --quiet; then
            echo "Nothing new to archive."
          else
            git commit -m "Archive pull for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Package the page for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
