name: Morning dispatch

on:
  schedule:
    # 10:01 UTC = 6:01 AM Eastern (EDT) / 5:01 AM (EST).
    - cron: "1 10 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

# contents: write lets the run commit each day's page into archive/.
# Without it the archive can't persist between runs.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so the archive step can rebase onto the latest main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      # A run checks out the commit that main pointed at when the run was
      # created. If main moves on before this step (another run, or your own
      # commit), a plain push is rejected as out of date. So: rebase onto
      # whatever main looks like right now, then push. Retried a few times in
      # case main moves again mid-step.
      - name: Save this pull to the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive archive.html
          if git diff --staged --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi
          git commit -m "Archive pull for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Archive pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing and retrying."
            sleep 5
          done
          echo "Could not push the archive after 3 attempts." >&2
          exit 1

      - name: Package the page for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
